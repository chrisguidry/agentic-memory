apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # One writer on one volume, so a new pod takes over only after the old one
  # is gone.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg17-trixie
          env:
            - name: POSTGRES_DB
              value: agentic_memory
            - name: POSTGRES_USER
              value: agentic_memory
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentic-memory-postgres
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U agentic_memory -d agentic_memory"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U agentic_memory -d agentic_memory"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U agentic_memory -d agentic_memory"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            # The volume root is a block device's root and can hold entries a
            # fresh cluster will not initialize over, so the data directory is
            # a subdirectory the kubelet makes.
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
