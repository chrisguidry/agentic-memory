apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base runs the api and the worker against a Postgres and a Redis that the
# consumer supplies. The namespace is named here, so a consumer that wants a
# different one names it too; the base creates no Namespace, because the
# overlay that points at this base usually does.
#
# The Secret is not here either. The api and the worker read one Secret named
# `agentic-memory` whose keys are the environment variable names, so a consumer
# supplies it from wherever that person keeps secrets. `deploy/README.md`
# lists the keys.
namespace: agentic-memory

resources:
  - config.yaml
  - api.yaml
  - worker.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: agentic-memory
      app.kubernetes.io/part-of: agentic-memory

# A placeholder, and the first thing a consumer overrides. A release moves
# `latest`; a development build is pinned by its own version.
images:
  - name: ghcr.io/chrisguidry/agentic-memory
    newTag: latest
