apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-memory
data:
  # The address the server binds, and where the baked embedding model lives.
  # Everything else the service and the worker read comes from the Secret of
  # the same name.
  AGENTIC_MEMORY_HOST: "0.0.0.0"
  AGENTIC_MEMORY_PORT: "4318"
  AGENTIC_MEMORY_EMBED_CACHE: /app/models
  # The person's time zone, as an IANA name such as America/New_York. The
  # writer is told when each message was said in this zone, so "tomorrow
  # morning" and "Monday" mean the person's. An overlay sets it.
  AGENTIC_MEMORY_TIME_ZONE: UTC
