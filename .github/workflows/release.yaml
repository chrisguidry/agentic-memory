name: release

# A push to main publishes a development image. A push of a release tag
# publishes the release image and moves `latest`. The version is calver, the
# same scheme the liken repositories use: a release is `YYYY.MM.DD-NNN`, and a
# development build names the release it follows, how many commits since, and
# the commit, as `YYYY.MM.DD-NNN-dev-CCC-SHA`.
#
# Before the first release tag exists there is nothing to describe, so a
# development build falls back to the commit's date with a zero release number.
# The date comes from the commit rather than the clock, so the same commit
# names the same version wherever it is built.

on:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  # The image and the host binaries are both named after the same commit, so
  # the version is computed once here and read by both jobs as an output,
  # rather than each job re-deriving it and risking the two disagreeing.
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.08.20-001"
              exit 1
            }
            version="$GITHUB_REF_NAME"
            release=true
          else
            if described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]' 2>/dev/null); then
              tag=${described%-*-g*}
              count=${described#"$tag"-}
              count=${count%-g*}
            else
              tag="$(git log -1 --format=%cd --date=format:%Y.%m.%d)-000"
              count=$(git rev-list --count HEAD)
            fi
            version=$(printf '%s-dev-%03d-%s' "$tag" "$count" "${GITHUB_SHA:0:8}")
            release=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, version]
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the tags
        run: |
          # A release moves `latest`; a development build carries only its own
          # version, so the moving tag always names the newest release.
          {
            echo "TAGS<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
            if [ "$RELEASE" = true ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          target: prod
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

  host:
    needs: [test, version]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod

      # CGO is off and the platform fixed at build time, because the binary
      # ships to a machine that never has the module's toolchain on it.
      - name: Build linux/amd64
        working-directory: host
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../agentic-memory-linux-amd64 .

      - name: Build linux/arm64
        working-directory: host
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../agentic-memory-linux-arm64 .

      - name: Checksum
        run: sha256sum agentic-memory-linux-amd64 agentic-memory-linux-arm64 > checksums.txt

      # Every push keeps the binaries as workflow artifacts, so a build off
      # main is downloadable without waiting for a release tag.
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-memory-host
          path: |
            agentic-memory-linux-amd64
            agentic-memory-linux-arm64
            checksums.txt

      # Only a release tag gets a GitHub release; a rerun of the same tag
      # uploads to the release that already exists instead of failing on it.
      - name: Attach to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              agentic-memory-linux-amd64 agentic-memory-linux-arm64 checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "agentic-memory $VERSION" \
              agentic-memory-linux-amd64 agentic-memory-linux-arm64 checksums.txt
          fi
