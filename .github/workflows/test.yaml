name: test

# The suite runs against a real Postgres with pgvector, started by the tests
# themselves through the runner's Docker, so the job needs nothing else. The
# embedding model is downloaded once and cached, because loading it is what
# makes a cold run slow and it does not change between runs.

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      # Warm the image so the first test is not waiting on a pull, but let the
      # pull fail without failing the job; the tests pull it themselves.
      - name: Warm the store image
        run: docker pull pgvector/pgvector:0.8.6-pg17-trixie || true

      - uses: actions/cache@v4
        with:
          path: server/.fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('server/uv.lock') }}

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Test
        run: uv run pytest -q

  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod

      # gofmt -l lists files that are not formatted and prints nothing when
      # every file is; the step fails on any output instead of gofmt's own
      # exit code, which stays 0 either way.
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
