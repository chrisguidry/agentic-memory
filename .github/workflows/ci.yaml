name: ci

# Every push to main and every pull request runs the suite. A pull request also
# builds the production image without pushing it, so a change that breaks the
# image fails before it lands rather than on the next push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build, but do not push
        uses: docker/build-push-action@v6
        with:
          context: server
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
